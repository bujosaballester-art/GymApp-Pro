<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymApp</title>
    <style>
        :root {
            --primary-color: #ff6b00;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --danger-color: #cc2e2e;
            --success-color: #2ecc71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }

        header {
            padding: 15px;
            text-align: center;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.4rem;
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 70px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            display: flex;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            z-index: 1000;
        }

        nav button {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            cursor: pointer;
            transition: color 0.2s, background-color 0.2s;
        }

        nav button.active {
            color: var(--primary-color);
            background-color: rgba(255, 107, 0, 0.05);
            font-weight: bold;
            border-top: 2px solid var(--primary-color);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        h2, h3 {
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        /* Selector de Días */
        .days-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }

        .day-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            text-align: left;
            position: relative;
        }

        .day-btn.active {
            border-color: var(--primary-color);
            background-color: rgba(255, 107, 0, 0.1);
        }

        .day-btn span {
            display: block;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Ejercicios */
        .exercise-card {
            background: #252525;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid var(--primary-color);
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .badge {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: #333;
            color: var(--text-muted);
        }

        .sets-list {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        /* Temporizador */
        .timer-box {
            background: #181818;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }

        .timer-display {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 5px 0;
        }

        /* Botones generales */
        button.btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }

        button.btn-secondary {
            background-color: #333;
            color: white;
        }

        button.btn-danger {
            background-color: var(--danger-color);
            color: white;
        }

        button.btn-success {
            background-color: var(--success-color);
            color: white;
        }

        .actions-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .actions-row button {
            flex: 1;
        }

        /* Inputs y Formularios de Ajustes/Modales */
        input, select {
            width: 100%;
            padding: 8px;
            margin: 5px 0 10px 0;
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 4px;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>GymApp</h1>
    </header>

    <main>
        <!-- PESTAÑA 1: ENTRENO -->
        <section id="entreno" class="tab-content active">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h2>Rutina Activa</h2>
                <button class="btn btn-secondary" onclick="openEditDay()" style="padding: 4px 8px; font-size: 0.75rem;">⚙️ Editar Día</button>
            </div>

            <!-- Selector de los 4 días -->
            <div class="days-container" id="daysSelector"></div>

            <!-- Temporizador -->
            <div class="timer-box">
                <label>TEMPORIZADOR DE DESCANSO</label>
                <div class="timer-display" id="timerDisplay">00:00</div>
                <div style="display: flex; justify-content: center; gap: 5px;">
                    <button class="btn btn-secondary" style="padding: 4px 8px;" onclick="startTimer(30)">30s</button>
                    <button class="btn btn-secondary" style="padding: 4px 8px;" onclick="startTimer(60)">60s</button>
                    <button class="btn btn-secondary" style="padding: 4px 8px;" onclick="startTimer(90)">90s</button>
                    <button class="btn btn-danger" style="padding: 4px 8px;" onclick="stopTimer()">Parar</button>
                </div>
            </div>

            <!-- Lista de ejercicios del día seleccionado -->
            <div id="exerciseContainer"></div>

            <!-- Botones Iniciar / Finalizar Entreno -->
            <div class="actions-row">
                <button id="btnToggleWorkout" class="btn btn-success" onclick="toggleWorkoutSession()">Iniciar Entreno</button>
            </div>
        </section>

        <!-- PESTAÑA 2: HISTORIAL -->
        <section id="historial" class="tab-content">
            <h2>Historial de Entrenamientos</h2>
            <div id="historyList" style="margin-top: 15px;">
                <p style="color: var(--text-muted); font-size: 0.85rem;">No hay entrenamientos guardados todavía.</p>
            </div>
        </section>

        <!-- PESTAÑA 3: AJUSTES -->
        <section id="ajustes" class="tab-content">
            <h2>Configuración de la Rutina</h2>
            <div class="card">
                <label>Día de inicio de rutina:</label>
                <input type="date" id="rutinaInicio" onchange="saveSettings()">
                
                <label>Día de finalización de rutina:</label>
                <input type="date" id="rutinaFin" onchange="saveSettings()">
            </div>

            <h2>Copias de Seguridad (Backups)</h2>
            <div class="card">
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px;">Exporta o importa tus entrenamientos y configuración sin afectar al historial.</p>
                <button class="btn btn-secondary" style="margin-bottom: 8px;" onclick="exportBackup()">Crear Copia de Seguridad</button>
                <label class="btn btn-secondary" style="display:block; text-align:center; cursor:pointer;">
                    Restaurar Copia <input type="file" id="importFile" style="display:none" onchange="importBackup(event)">
                </label>
            </div>
        </section>
    </main>

    <!-- MODAL / VISTA DE EDICIÓN DE DÍA -->
    <div id="editModal" class="card" style="display:none; position:fixed; top:10px; left:10px; right:10px; bottom:10px; z-index:2000; background:#181818; overflow-y:auto; max-width:460px; margin:0 auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 id="editModalTitle">Editar Día</h3>
            <button class="btn btn-danger" style="padding: 2px 8px;" onclick="closeEditDay()">✕</button>
        </div>
        <div id="editExercisesList"></div>
        <button class="btn btn-success" style="margin-top: 10px;" onclick="addExerciseToCurrentDay()">+ Añadir Ejercicio</button>
        <button class="btn" style="margin-top: 15px; width: 100%; background-color: var(--success-color);" onclick="saveEditedDay()">Guardar Cambios</button>
    </div>

    <nav>
        <button class="active" onclick="switchTab('entreno', event)">Entreno</button>
        <button onclick="switchTab('historial', event)">Historial</button>
        <button onclick="switchTab('ajustes', event)">Ajustes</button>
    </nav>

    <script>
        // Estructura de Datos por Defecto
        const defaultWorkouts = {
            1: { title: "DÍA 1: EMPUJE", subtitle: "PECHO, HOMBRO, TRICEPS", exercises: [{ name: "Press de Banca", type: "Compuesto", sets: 4, reps: "10-8-8-6", rest: 90 }] },
            2: { title: "DÍA 2: TRACCION", subtitle: "ESPALDA, HOMBRO, BICEPS", exercises: [{ name: "Dominadas", type: "Compuesto", sets: 3, reps: "8", rest: 90 }] },
            3: { title: "DÍA 3: PIERNAS", subtitle: "PIERNAS", exercises: [{ name: "Sentadilla Libre", type: "Compuesto", sets: 4, reps: "10-8-8-6", rest: 120 }] },
            4: { title: "DÍA 4: BRAZOS", subtitle: "BICEPS, TRICEPS, HOMBRO", exercises: [{ name: "Curl Bíceps", type: "Aislado", sets: 3, reps: "12", rest: 60 }] }
        };

        let workouts = JSON.parse(localStorage.getItem('gym_workouts')) || defaultWorkouts;
        let historyData = JSON.parse(localStorage.getItem('gym_history')) || [];
        let settings = JSON.parse(localStorage.getItem('gym_settings')) || { inicio: '', fin: '' };
        
        let currentDay = 1;
        let activeWorkoutStart = null;
        let timerInterval = null;

        // Gestión de Pestañas
        function switchTab(tabId, event) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
            if(tabId === 'historial') renderHistory();
        }

        // Renderizar Pestaña Entreno
        function renderEntreno() {
            const selector = document.getElementById('daysSelector');
            selector.innerHTML = '';
            
            for(let i = 1; i <= 4; i++) {
                selector.innerHTML += `
                    <button class="day-btn ${currentDay === i ? 'active' : ''}" onclick="selectDay(${i})">
                        <strong>DÍA ${i}</strong>
                        <span>${workouts[i].subtitle}</span>
                    </button>
                `;
            }

            const container = document.getElementById('exerciseContainer');
            container.innerHTML = `<h3>${workouts[currentDay].title} (${workouts[currentDay].subtitle})</h3>`;
            
            workouts[currentDay].exercises.forEach((ex, idx) => {
                container.innerHTML += `
                    <div class="exercise-card">
                        <div class="exercise-header">
                            <strong>${ex.name}</strong>
                            <span class="badge">${ex.type}</span>
                        </div>
                        <div class="sets-list">
                            Series: <strong>${ex.sets}</strong> | Reps: <strong>${ex.reps}</strong> | Descanso: <strong>${ex.rest}s</strong>
                        </div>
                        <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="startTimer(${ex.rest})">⏱ Descansar (${ex.rest}s)</button>
                    </div>
                `;
            });
        }

        function selectDay(day) {
            currentDay = day;
            renderEntreno();
        }

        // Temporizador
        function startTimer(seconds) {
            stopTimer();
            let timeLeft = seconds;
            const display = document.getElementById('timerDisplay');
            
            function updateDisplay() {
                let m = Math.floor(timeLeft / 60);
                let s = timeLeft % 60;
                display.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }
            
            updateDisplay();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateDisplay();
                if(timeLeft < 0) {
                    stopTimer();
                    display.textContent = "¡TIEMPO!";
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            document.getElementById('timerDisplay').textContent = "00:00";
        }

        // Iniciar / Finalizar Entreno
        function toggleWorkoutSession() {
            const btn = document.getElementById('btnToggleWorkout');
            if(!activeWorkoutStart) {
                activeWorkoutStart = new Date();
                btn.textContent = "Finalizar Entreno";
                btn.className = "btn btn-danger";
                alert("¡Entrenamiento iniciado!");
            } else {
                const now = new Date();
                const diffSecs = Math.floor((now - activeWorkoutStart) / 1000);
                const mins = Math.floor(diffSecs / 60);
                const secs = diffSecs % 60;
                
                const dayString = `${now.getDate().toString().padStart(2, '0')}/${(now.getMonth()+1).toString().padStart(2, '0')}/${now.getFullYear()}`;
                
                historyData.unshift({
                    date: dayString,
                    name: workouts[currentDay].title,
                    duration: `${mins}m ${secs}s`
                });

                localStorage.setItem('gym_history', JSON.stringify(historyData));
                activeWorkoutStart = null;
                btn.textContent = "Iniciar Entreno";
                btn.className = "btn btn-success";
                alert("¡Entrenamiento guardado en el historial con éxito!");
            }
        }

        // Historial
        function renderHistory() {
            const list = document.getElementById('historyList');
            if(historyData.length === 0) {
                list.innerHTML = `<p style="color: var(--text-muted); font-size: 0.85rem;">No hay entrenamientos guardados todavía.</p>`;
                return;
            }
            list.innerHTML = '';
            historyData.forEach((item, index) => {
                list.innerHTML += `
                    <div class="history-item">
                        <div>
                            <strong>${item.name}</strong><br>
                            <small style="color: var(--text-muted);">${item.date} - Duración: ${item.duration}</small>
                        </div>
                        <button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.75rem;" onclick="deleteHistory(${index})">Eliminar</button>
                    </div>
                `;
            });
        }

        function deleteHistory(index) {
            historyData.splice(index, 1);
            localStorage.setItem('gym_history', JSON.stringify(historyData));
            renderHistory();
        }

        // Ajustes y Configuración
        function loadSettings() {
            document.getElementById('rutinaInicio').value = settings.inicio || '';
            document.getElementById('rutinaFin').value = settings.fin || '';
        }

        function saveSettings() {
            settings.inicio = document.getElementById('rutinaInicio').value;
            settings.fin = document.getElementById('rutinaFin').value;
            localStorage.setItem('gym_settings', JSON.stringify(settings));
        }

        // Copias de Seguridad (Backups)
        function exportBackup() {
            const backupObj = { workouts, settings };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupObj));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "gym_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importBackup(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if(imported.workouts) {
                        workouts = imported.workouts;
                        localStorage.setItem('gym_workouts', JSON.stringify(workouts));
                    }
                    if(imported.settings) {
                        settings = imported.settings;
                        localStorage.setItem('gym_settings', JSON.stringify(settings));
                        loadSettings();
                    }
                    renderEntreno();
                    alert("Copia de seguridad cargada correctamente (el historial se ha mantenido intacto).");
                } catch(err) {
                    alert("El archivo no es válido.");
                }
            };
            reader.readAsText(file);
        }

        // Edición de Días de Entreno
        function openEditDay() {
            document.getElementById('editModalTitle').textContent = `Editar ${workouts[currentDay].title}`;
            renderEditExercises();
            document.getElementById('editModal').style.display = 'block';
        }

        function closeEditDay() {
            document.getElementById('editModal').style.display = 'none';
            renderEntreno();
        }

        function renderEditExercises() {
            const container = document.getElementById('editExercisesList');
            container.innerHTML = '';
            workouts[currentDay].exercises.forEach((ex, idx) => {
                container.innerHTML += `
                    <div style="background:#222; padding:10px; margin-bottom:10px; border-radius:6px;">
                        <label>Nombre Ejercicio:</label>
                        <input type="text" id="ex_name_${idx}" value="${ex.name}">
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 5px;">
                            <div>
                                <label>Series:</label>
                                <input type="number" id="ex_sets_${idx}" value="${ex.sets}">
                            </div>
                            <div>
                                <label>Descanso (s):</label>
                                <input type="number" id="ex_rest_${idx}" value="${ex.rest}">
                            </div>
                        </div>
                        <label>Repeticiones:</label>
                        <input type="text" id="ex_reps_${idx}" value="${ex.reps}">
                        <label>Tipo:</label>
                        <select id="ex_type_${idx}">
                            <option value="Compuesto" ${ex.type === 'Compuesto' ? 'selected' : ''}>Compuesto</option>
                            <option value="Aislado" ${ex.type === 'Aislado' ? 'selected' : ''}>Aislado</option>
                        </select>
                        <button class="btn btn-danger" style="padding:4px 8px; margin-top:5px;" onclick="removeExercise(${idx})">Eliminar Ejercicio</button>
                    </div>
                `;
            });
        }

        function addExerciseToCurrentDay() {
            workouts[currentDay].exercises.push({ name: "Nuevo Ejercicio", type: "Compuesto", sets: 3, reps: "10", rest: 60 });
            renderEditExercises();
        }

        function removeExercise(idx) {
            workouts[currentDay].exercises.splice(idx, 1);
            renderEditExercises();
        }

        function saveEditedDay() {
            workouts[currentDay].exercises.forEach((ex, idx) => {
                ex.name = document.getElementById(`ex_name_${idx}`).value;
                ex.sets = parseInt(document.getElementById(`ex_sets_${idx}`).value) || 1;
                ex.reps = document.getElementById(`ex_reps_${idx}`).value;
                ex.rest = parseInt(document.getElementById(`ex_rest_${idx}`).value) || 60;
                ex.type = document.getElementById(`ex_type_${idx}`).value;
            });
            localStorage.setItem('gym_workouts', JSON.stringify(workouts));
            closeEditDay();
            alert("Rutina actualizada correctamente.");
        }

        // Inicialización al cargar la página
        renderEntreno();
        loadSettings();
    </script>
</body>
</html>
